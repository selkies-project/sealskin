<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SealSkin</title>
    <link rel="stylesheet" href="css/options.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body class="home">
    <div id="backdrop" aria-hidden="true"></div>
    <div class="home-wrap">
        <section class="hero" id="hero">
            <div class="hero-search">
                <i class="fas fa-search"></i>
                <input type="text" id="hero-input" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="web.home.searchPlaceholder" placeholder="Search applications, or paste a link to open it in isolation">
                <button type="button" id="upload-button" class="secondary"><i class="fas fa-upload"></i> <span data-i18n="web.home.upload">Upload a file</span></button>
                <button type="button" id="edit-button" class="secondary icon-only" hidden data-i18n-title="web.home.customize" title="Customize the page"><i class="fas fa-pen"></i></button>
                <input type="file" id="file-input" hidden>
            </div>
            <div class="hero-chips" id="status-chips"></div>
        </section>

        <div id="context-bar" class="context-bar" hidden>
            <i class="fas fa-link" id="context-icon"></i>
            <span id="context-text"></span>
            <button type="button" id="context-clear" class="secondary" data-i18n="common.cancel">Cancel</button>
        </div>

        <section id="sessions-section" hidden>
            <div class="section-head">
                <h2 data-i18n="web.home.running">Running sessions</h2>
            </div>
            <div id="sessions-row" class="session-row"></div>
        </section>

        <nav id="board-tabs" class="board-tabs" hidden></nav>

        <div id="edit-bar" class="edit-bar" hidden>
            <div class="edit-main">
                <span class="edit-title"><i class="fas fa-pen"></i> <span id="edit-title"></span></span>
                <button type="button" id="edit-add-tile" class="secondary"><i class="fas fa-plus"></i> <span data-i18n="web.board.addTile">Add a tile</span></button>
                <button type="button" id="customize-button" class="secondary"><i class="fas fa-paint-brush"></i> <span data-i18n="web.board.appearance">Appearance</span></button>
                <div class="menu-wrap">
                    <button type="button" id="edit-more" class="secondary"><i class="fas fa-ellipsis-h"></i> <span data-i18n="web.board.more">More</span></button>
                    <div id="edit-menu" class="menu" hidden>
                        <button type="button" data-act="tidy"><i class="fas fa-compress-alt"></i> <span data-i18n="web.board.tidy">Close the empty rows</span></button>
                        <button type="button" data-act="import-bookmarks"><i class="fas fa-bookmark"></i> <span data-i18n="web.board.importBookmarks">Import browser bookmarks</span></button>
                        <button type="button" data-act="export-page"><i class="fas fa-file-export"></i> <span data-i18n="web.board.exportPage">Export this page</span></button>
                        <button type="button" data-act="import-page"><i class="fas fa-file-import"></i> <span data-i18n="web.board.importPage">Import a page</span></button>
                        <button type="button" data-act="show-apps"><i class="fas fa-th"></i> <span data-i18n="web.board.showApps">Add the applications</span></button>
                        <button type="button" data-act="rename-page"><i class="fas fa-pen"></i> <span data-i18n="web.board.renamePage">Rename this page</span></button>
                        <button type="button" data-act="delete-page"><i class="fas fa-trash"></i> <span data-i18n="web.board.deletePage">Delete this page</span></button>
                        <button type="button" data-act="reset-page"><i class="fas fa-undo"></i> <span data-i18n="web.board.resetPage">Reset this page</span></button>
                        <button type="button" data-act="reset-all"><i class="fas fa-trash-restore"></i> <span data-i18n="web.board.resetAll">Reset everything to default</span></button>
                    </div>
                </div>
                <span class="spacer"></span>
                <button type="button" id="edit-done" class="primary"><i class="fas fa-check"></i> <span data-i18n="web.board.done">Done</span></button>
            </div>
            <p id="edit-narrow" class="home-hint" hidden data-i18n="web.board.narrow">Tiles are arranged on a wider window; here they show in reading order.</p>
            <div id="admin-bar" class="edit-admin" hidden>
                <span class="seg" id="admin-scope">
                    <button type="button" data-scope="mine"><span data-i18n="web.board.scopeMine">My page</span></button>
                    <button type="button" data-scope="shared"><span data-i18n="web.board.scopeShared">Shared dashboard</span></button>
                </span>
                <span id="admin-note" class="home-hint"></span>
                <span class="spacer"></span>
                <button type="button" id="admin-settings" class="secondary"><i class="fas fa-sliders-h"></i> <span data-i18n="web.board.dashboardSettings">Dashboard settings</span></button>
                <button type="button" id="admin-widgets" class="secondary"><i class="fas fa-puzzle-piece"></i> <span data-i18n="web.board.widgetLibrary">Widget library</span></button>
                <button type="button" id="admin-manage" class="secondary"><i class="fas fa-th-large"></i> <span data-i18n="web.board.allDashboards">All dashboards</span></button>
                <button type="button" id="admin-save" class="primary"><i class="fas fa-cloud-upload-alt"></i> <span data-i18n="web.board.saveShared">Save for everyone</span></button>
            </div>
        </div>

        <div id="board">
            <section id="apps-section">
                <div class="section-head">
                    <h2 data-i18n="web.home.applications">Applications</h2>
                    <span class="section-tools"></span>
                    <div id="type-chips" class="chip-row"></div>
                </div>
                <div id="app-grid" class="app-tiles"></div>
                <div id="apps-empty" class="home-empty" hidden>
                    <i class="fas fa-box-open"></i>
                    <p id="apps-empty-text"></p>
                    <button type="button" id="apps-empty-admin" class="primary" hidden data-i18n="web.home.openAppStores">Open the App Stores</button>
                </div>
            </section>
        </div>
    </div>

    <div id="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog">
        <header class="drawer-head">
            <img id="drawer-logo" src="icons/icon128.png" alt="">
            <div>
                <h3 id="drawer-name"></h3>
                <p id="drawer-context" class="drawer-context"></p>
            </div>
            <button type="button" id="favorite-btn" class="secondary icon-only" data-i18n-title="web.home.addFavorite" title="Add to favorites"><i class="far fa-star"></i></button>
            <button type="button" id="hide-btn" class="secondary icon-only" data-i18n-title="web.home.hideApp" title="Hide"><i class="fas fa-eye-slash"></i></button>
            <button type="button" id="drawer-close" class="secondary icon-only" data-i18n-title="common.close" title="Close"><i class="fas fa-times"></i></button>
        </header>
        <div class="drawer-body">
            <div id="homedir-form-group" class="form-group">
                <label for="homeDirectory" data-i18n="common.storage">Storage</label>
                <select id="homeDirectory"></select>
            </div>
            <div id="gpu-form-group" class="form-group">
                <label for="gpuSelect" data-i18n="common.gpu">GPU</label>
                <select id="gpuSelect"></select>
            </div>
            <div id="vpn-form-group" class="form-group">
                <label for="vpnSelect" data-i18n="common.vpn">VPN</label>
                <select id="vpnSelect"></select>
            </div>
            <div id="vpn-endpoint-form-group" class="form-group">
                <label for="vpnEndpointSelect" data-i18n="web.home.vpnEndpoint">VPN endpoint</label>
                <select id="vpnEndpointSelect"></select>
            </div>
            <div id="where-form-group" class="form-group">
                <label for="whereSelect" data-i18n="popup.launchView.where">Where</label>
                <select id="whereSelect"></select>
            </div>
            <div class="form-group">
                <label for="language" data-i18n="common.language">Language</label>
                <select id="language"></select>
            </div>
            <div class="settings-grid" style="grid-template-columns: 1fr;">
                <div class="form-group"><label><input type="checkbox" id="collaborationMode"> <span data-i18n="popup.launchView.collaborationMode">Collaborative Session</span></label></div>
                <div class="form-group"><label><input type="checkbox" id="waylandMode" checked> <span data-i18n="popup.launchView.waylandMode">Wayland Mode</span></label></div>
                <div class="form-group"><label><input type="checkbox" id="openInTab"> <span data-i18n="popup.launchView.newTab">Open in a new tab</span></label></div>
                <div class="form-group" id="open-file-group"><label><input type="checkbox" id="openFileOnLaunch" checked> <span data-i18n="popup.launchView.openFile">Open file on launch</span></label></div>
            </div>
        </div>
        <footer class="drawer-foot">
            <button type="button" id="copy-link-btn" class="secondary" data-i18n-title="web.home.copyLinkHelp" title="A link that opens this application with these options"><i class="fas fa-link"></i> <span data-i18n="web.home.copyLink">Copy link</span></button>
            <button type="button" id="launch-btn" class="primary"><i class="fas fa-play"></i> <span data-i18n="popup.launchView.launchButton">Launch</span></button>
        </footer>
    </aside>

    <div id="customize-backdrop" hidden></div>
    <aside id="customize" class="drawer customize" hidden aria-modal="true" role="dialog">
        <header class="drawer-head">
            <i class="fas fa-paint-brush drawer-icon"></i>
            <div><h3 data-i18n="web.board.appearance">Appearance</h3></div>
            <button type="button" id="customize-close" class="secondary icon-only" data-i18n-title="common.close" title="Close"><i class="fas fa-times"></i></button>
        </header>
        <div class="drawer-body">
            <div class="form-group">
                <label data-i18n="web.home.background">Background</label>
                <div id="bg-kinds" class="seg">
                    <button type="button" data-kind="color" data-i18n="web.home.bgColor">Color</button>
                    <button type="button" data-kind="image" data-i18n="web.home.bgPicture">Picture</button>
                </div>
            </div>
            <div id="bg-color-group" hidden>
                <div class="form-group">
                    <label data-i18n="web.home.color">Color</label>
                    <div id="bg-swatches" class="swatches">
                        <!-- First, so the browser's picker opens toward the page rather than off its right edge. -->
                        <label class="swatch custom" data-i18n-title="web.home.colorCustom" title="Custom color"><input type="color" id="bg-color" value="#7c6cf0"><i class="fas fa-eye-dropper"></i></label>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="web.home.style">Style</label>
                    <div id="bg-styles" class="bg-choices">
                        <button type="button" class="bg-choice paint style-solid" data-style="solid" data-i18n-title="web.home.styleSolid" title="Solid"></button>
                        <button type="button" class="bg-choice paint style-glow" data-style="glow" data-i18n-title="web.home.styleGlow" title="Glow"></button>
                        <button type="button" class="bg-choice paint style-diagonal" data-style="diagonal" data-i18n-title="web.home.styleDiagonal" title="Diagonal"></button>
                        <button type="button" class="bg-choice paint style-aurora" data-style="aurora" data-i18n-title="web.home.styleAurora" title="Aurora"></button>
                        <button type="button" class="bg-choice paint style-vignette" data-style="vignette" data-i18n-title="web.home.styleVignette" title="Vignette"></button>
                    </div>
                </div>
            </div>
            <div id="bg-image-group" hidden>
                <div class="form-group">
                    <div id="bg-preview" class="bg-preview">
                        <button type="button" id="bg-pick" class="secondary"><i class="fas fa-image"></i> <span data-i18n="web.home.bgUpload">Upload a picture</span></button>
                    </div>
                    <input type="file" id="bg-file" accept="image/*" hidden>
                </div>
                <div class="form-group">
                    <label data-i18n="web.home.fit">Position</label>
                    <div id="bg-fits" class="seg">
                        <button type="button" data-fit="cover" data-i18n="web.home.fitFill">Fill</button>
                        <button type="button" data-fit="contain" data-i18n="web.home.fitFit">Fit</button>
                        <button type="button" data-fit="stretch" data-i18n="web.home.fitStretch">Stretch</button>
                        <button type="button" data-fit="center" data-i18n="web.home.fitCenter">Center</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bg-blur"><span data-i18n="web.home.blur">Blur</span> <output id="bg-blur-value"></output></label>
                    <input type="range" id="bg-blur" min="0" max="24" step="1">
                </div>
            </div>
            <div class="form-group" id="bg-dim-group" hidden>
                <label for="bg-dim"><span data-i18n="web.home.dim">Dim</span> <output id="bg-dim-value"></output></label>
                <input type="range" id="bg-dim" min="0" max="90" step="5">
            </div>
            <h4 class="drawer-part" data-i18n="web.board.tiles">Tiles</h4>
            <p id="look-note" class="field-hint"></p>
            <div class="form-group">
                <label data-i18n="web.board.lookStyle">Cards</label>
                <div id="look-style" class="seg">
                    <button type="button" data-value="solid" data-i18n="web.board.lookSolid">Solid</button>
                    <button type="button" data-value="glass" data-i18n="web.board.lookGlass">Glass</button>
                    <button type="button" data-value="flat" data-i18n="web.board.lookFlat">None</button>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="web.board.lookDensity">Rows</label>
                <div id="look-density" class="seg">
                    <button type="button" data-value="compact" data-i18n="web.board.lookCompact">Compact</button>
                    <button type="button" data-value="normal" data-i18n="web.board.lookNormal">Normal</button>
                    <button type="button" data-value="roomy" data-i18n="web.board.lookRoomy">Roomy</button>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="web.board.lookWidth">Page width</label>
                <div id="look-width" class="seg">
                    <button type="button" data-value="normal" data-i18n="web.board.lookCentered">Centered</button>
                    <button type="button" data-value="wide" data-i18n="web.board.lookWide">Whole window</button>
                </div>
            </div>
            <div class="form-group"><label><input type="checkbox" id="look-labels"> <span data-i18n="web.board.lookLabels">Show names on application and link tiles</span></label></div>
            <div class="form-group" id="look-accent-group">
                <label for="look-accent" data-i18n="web.board.lookAccent">Accent color</label>
                <input type="color" id="look-accent" value="#8b7cf6">
            </div>
            <button type="button" id="look-reset" class="secondary small"><i class="fas fa-undo"></i> <span data-i18n="web.board.lookReset">Use the dashboard's look</span></button>
        </div>
        <footer class="drawer-foot">
            <button type="button" id="customize-reset" class="secondary"><i class="fas fa-undo"></i> <span data-i18n="web.home.reset">Reset</span></button>
        </footer>
    </aside>

    <div id="drop-overlay" hidden><div><i class="fas fa-file-upload"></i><p data-i18n="web.home.drop">Drop the file to open it in SealSkin</p></div></div>

    <script type="module" src="home.js"></script>
</body>
</html>
