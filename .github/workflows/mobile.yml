name: Mobile

# Builds the Capacitor apps for both stores. Every run produces the signed
# artifacts (IPA for iOS, APK and AAB for Android). The two upload jobs run
# only when `upload` is set: by hand from the Actions tab, or by the Release
# workflow when a stable release is cut. The Pre-release workflow calls this
# with `upload: false` so builds land in the pre-release but never in a store.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight and the Google Play internal track"
        type: boolean
        default: false
  workflow_call:
    inputs:
      upload:
        description: "Upload to TestFlight and the Google Play internal track"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TEAM_ID: 3HWXQ6BR8S
  BUNDLE_ID: io.linuxserver.sealskinisolation
  PACKAGE_NAME: io.linuxserver.sealskin
  XCODE: /Applications/Xcode_26.2.app

jobs:
  version:
    name: Version numbers
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.numbers.outputs.version }}
      build: ${{ steps.numbers.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the store build number
        id: numbers
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)

          # Both stores reject an upload whose build number is not higher than
          # the last one they saw, and that rule spans every workflow in this
          # repository. The commit count on the branch grows with every push,
          # so it is used as the build number. The offset keeps it above the
          # numbers uploaded by hand before this workflow existed (Play
          # versionCode 300, TestFlight build 4). Never lower it.
          BUILD=$(( 1000 + $(git rev-list --count HEAD) ))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, store build number $BUILD"

  android:
    name: Build Android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build signed APK and AAB
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.build }}
        run: bash build.sh

      - name: Keep the APK and AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealskin-android-${{ needs.version.outputs.version }}
          path: |
            mobile/sealskin-v*.apk
            mobile/sealskin-v*.aab
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Android build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ needs.version.outputs.version }}\` (versionCode \`${{ needs.version.outputs.build }}\`) |"
            echo "| Package | \`$PACKAGE_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build iOS
    needs: version
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      # The store version is deliberately independent of ../VERSION: App Store
      # Connect only requires it to increase, and 2.<build number> always does.
      IOS_VERSION: 2.${{ needs.version.outputs.build }}
      IOS_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Follows https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"

          # A throwaway keychain that lives only for this job.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$CERT"

          # xcodebuild finds profiles by UUID in these directories.
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.mobileprovision"
          done

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Verify signing material
        run: |
          security find-identity -v -p codesigning "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" || {
            echo "::error::No 'Apple Distribution' identity in the keychain. Check IOS_DIST_CERT_P12 and IOS_DIST_CERT_PASSWORD."
            exit 1
          }

          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          [ "$APP_ID" = "$TEAM_ID.$BUNDLE_ID" ] || {
            echo "::error::Provisioning profile is for '$APP_ID', expected '$TEAM_ID.$BUNDLE_ID'."
            exit 1
          }

          EXPIRES=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          echo "Profile '$PROFILE_NAME' for $APP_ID, expires $EXPIRES"

          # The profile must have been issued against the certificate we imported.
          PROFILE_CERT_SHA1=$(plutil -extract DeveloperCertificates.0 raw -o - "$RUNNER_TEMP/profile.plist" \
            | base64 --decode | openssl x509 -inform DER -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$PROFILE_CERT_SHA1" || {
            echo "::error::The provisioning profile was issued for certificate $PROFILE_CERT_SHA1, which is not the one in IOS_DIST_CERT_P12. Regenerate the profile against the current certificate."
            exit 1
          }

      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            SEALSKIN_PROFILE="$PROFILE_NAME" \
            MARKETING_VERSION="$IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD" \
            | xcbeautify --renderer github-actions

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | xcbeautify --renderer github-actions

          # Named like the APK so the release assets line up.
          mv "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/export/sealskin-v${{ needs.version.outputs.version }}.ipa"

      - name: Keep the IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealskin-ios-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/export/sealskin-v*.ipa
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## iOS build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$IOS_VERSION\` (build \`$IOS_BUILD\`) |"
            echo "| Bundle ID | \`$BUNDLE_ID\` |"
            echo "| Profile | ${PROFILE_NAME:-not installed} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/appstore.mobileprovision"

  upload-android:
    name: Upload to Google Play
    needs: [version, android]
    if: inputs.upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sealskin-android-${{ needs.version.outputs.version }}
          path: dist

      - name: Upload the AAB to the internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: dist/sealskin-v*.aab
          tracks: internal
          status: completed

      - name: Summary
        run: |
          echo "Uploaded versionCode ${{ needs.version.outputs.build }} to the Google Play internal testing track." >> "$GITHUB_STEP_SUMMARY"

  upload-ios:
    name: Upload to TestFlight
    needs: [version, ios]
    if: inputs.upload
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sealskin-ios-${{ needs.version.outputs.version }}
          path: dist

      - name: Upload to App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          sudo xcode-select -s "$XCODE"

          # altool looks for the key at ~/private_keys/AuthKey_<KEY_ID>.p8
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          xcrun altool --upload-app -f dist/sealskin-v*.ipa -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

          echo "Uploaded build ${{ needs.version.outputs.build }}. It appears under TestFlight in App Store Connect once Apple finishes processing it (usually 5-30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8
