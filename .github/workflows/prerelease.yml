name: Pre-release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build served UI and shells
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Package served UI
        run: |
          VERSION=$(cat VERSION)
          tar -C client/dist -czf "sealskin-ui-v${VERSION}.tar.gz" ui

      - name: Build server wheel
        run: |
          cp -r client/dist/ui server/app/ui
          cp VERSION server/app/VERSION
          pip install build
          python -m build --wheel server/
          VERSION=$(cat VERSION)
          mv server/dist/sealskin_server-${VERSION}-py3-none-any.whl "sealskin_server-${VERSION}-py3-none-any.whl"

      - name: Build browser extensions
        working-directory: browser_extension
        run: bash build.sh

      - name: Build Android APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash build.sh

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          prerelease: true
          generate_release_notes: true
          files: |
            sealskin-ui-v*.tar.gz
            browser_extension/sealskin-chrome-v*.zip
            browser_extension/sealskin-firefox-v*.zip
            mobile/sealskin-v*.apk
            sealskin_server-*-py3-none-any.whl
