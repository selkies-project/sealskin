name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    name: Server lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt ruff pytest pytest-asyncio

      - name: Lint
        run: ruff check server

      - name: Tests
        run: pytest server/tests

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build served UI and shells
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Check version consistency
        run: |
          VERSION=$(cat VERSION)
          for f in client/dist/extension/manifest.chrome.json client/dist/extension/manifest.firefox.json; do
            grep -q "\"version\": \"${VERSION}\"" "$f" || { echo "::error::$f does not carry version ${VERSION}"; exit 1; }
          done
          grep -q "\"version\": \"${VERSION}\"" client/dist/ui/manifest.json
