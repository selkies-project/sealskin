name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflow files
        # actionlint checks the expressions and runs shellcheck over every `run:` block, the
        # releases Selkies' CI lints its own with, each checked against its SHA-256 (a version
        # bump takes the hash with it)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL --retry 5 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" actionlint.tar.gz "${SHELLCHECK_SHA256}" shellcheck.tar.xz | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${PWD}:${PATH}" ./actionlint -color

  server:
    name: Server lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt ruff pytest pytest-asyncio

      - name: Lint
        run: ruff check server

      - name: Tests
        run: pytest server/tests

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build served UI and shells
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Check version consistency
        run: |
          VERSION=$(cat VERSION)
          for f in client/dist/extension/manifest.chrome.json client/dist/extension/manifest.firefox.json; do
            grep -q "\"version\": \"${VERSION}\"" "$f" || { echo "::error::$f does not carry version ${VERSION}"; exit 1; }
          done
          grep -q "\"version\": \"${VERSION}\"" client/dist/ui/manifest.json

  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build UI
        working-directory: client
        run: |
          npm ci
          SEALSKIN_BUILD_STRICT=1 node build.mjs --target ui

      - name: Copy UI and VERSION into package
        run: |
          cp -r client/dist/ui server/app/ui
          cp VERSION server/app/VERSION

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel server/

      - name: Validate wheel contents
        run: |
          pip install twine
          twine check server/dist/*.whl
          python -c "import zipfile, sys; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); \
            assert any('app/main.py' in n for n in names), 'missing app/main.py'; \
            assert any('app/ui/' in n for n in names), 'missing UI assets'; \
            assert any('VERSION' in n for n in names), 'missing VERSION'; \
            print('Wheel contents OK')" server/dist/*.whl
