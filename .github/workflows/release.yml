name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="release-notes/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::No release notes found at ${NOTES}; refusing to cut a stable release for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build browser extensions
        working-directory: browser_extension
        run: bash build.sh

      - name: Build Android APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash build.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: false
          files: |
            browser_extension/sealskin-chrome-v*.zip
            browser_extension/sealskin-firefox-v*.zip
            mobile/sealskin-v*.apk
