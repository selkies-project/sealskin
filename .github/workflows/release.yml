name: Release

# A tag push releases that tag. A manual run releases the tag it names,
# tagging the commit it started from when the tag is new, and decides the
# "Latest" badge, which LinuxServer.io's image follows: held off a fix to an
# older series. The tag is VERSION exactly, which the browser extension
# manifests carry, so it is always a release; the per-commit pre-releases are
# the release candidates.
#
# The mobile apps build from the run's own commit, so a manual run that
# releases a tag which already exists is started from that tag.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, VERSION exactly (e.g. 0.4.0), tagging this run's commit when it is new
        type: string
        required: true
      latest:
        description: Designate this release as the latest, the one LinuxServer.io's image builds; never holds a fix to an older series back
        type: choice
        options: [auto, always, never]
        default: auto

permissions:
  contents: write

env:
  # The tag this run releases: the pushed one, or the one a manual run names
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      path: ${{ steps.notes.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate release notes
        id: notes
        run: |
          VERSION="${RELEASE_TAG}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match VERSION file (${FILE_VERSION}); a release tag carries the version alone, with no leading v"
            exit 1
          fi
          NOTES="release-notes/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::No release notes found at ${NOTES}; refusing to cut a stable release for tag ${RELEASE_TAG}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Tag the commit this run started from
        # Checked above, so a refused run leaves no tag behind; an existing tag
        # is released only from a run on its own commit, which the apps build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${RELEASE_TAG}" --jq .status)"
            [ "${status}" = identical ] || { echo "::error::${RELEASE_TAG} tags another commit than this run's; start the run from the tag (Use workflow from)"; exit 1; }
            echo "${RELEASE_TAG} is already tagged"
          else
            [ "${GITHUB_REF}" = refs/heads/main ] || { echo "::error::a new tag is cut from main; this run started from ${GITHUB_REF_NAME}"; exit 1; }
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}"
            echo "${RELEASE_TAG} now tags ${GITHUB_SHA}"
          fi

      - name: Check the tag is on main
        # A release is cut from main and its tags alone: a tag on any other
        # commit is refused before anything is built or created under it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          case "${status}" in
            identical|behind) ;;
            *) echo "::error::${RELEASE_TAG} points at a commit that is not on main (${status:-unknown})"; exit 1 ;;
          esac

  # A stable release is the one automatic path to the stores: the mobile
  # workflow builds both apps and pushes them to TestFlight and the Google
  # Play internal track.
  mobile:
    name: Mobile apps
    needs: check
    uses: ./.github/workflows/mobile.yml
    with:
      upload: true
    secrets: inherit

  release:
    name: Release
    needs: [check, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build served UI and shells
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Package served UI
        run: |
          VERSION=$(cat VERSION)
          tar -C client/dist -czf "sealskin-ui-v${VERSION}.tar.gz" ui

      - name: Build server wheel
        run: |
          cp -r client/dist/ui server/app/ui
          cp VERSION server/app/VERSION
          pip install build
          python -m build --wheel server/
          VERSION=$(cat VERSION)
          mv "server/dist/sealskin_server-${VERSION}-py3-none-any.whl" "sealskin_server-${VERSION}-py3-none-any.whl"

      - name: Build browser extensions
        working-directory: browser_extension
        run: bash build.sh

      - name: Fetch the mobile builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sealskin-*
          merge-multiple: true
          path: mobile-dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: ${{ needs.check.outputs.path }}
          prerelease: false
          # Every tag here is a release, which takes the badge unless a manual
          # run holds it back
          make_latest: ${{ inputs.latest != 'never' }}
          files: |
            sealskin-ui-v*.tar.gz
            browser_extension/sealskin-chrome-v*.zip
            browser_extension/sealskin-firefox-v*.zip
            mobile-dist/sealskin-v*.apk
            mobile-dist/sealskin-v*.ipa
            sealskin_server-*-py3-none-any.whl
