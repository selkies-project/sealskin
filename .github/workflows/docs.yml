name: Docs

# Builds the documentation site from docs/ and publishes it to GitHub Pages.
# The Server Reference is generated from the docstrings in server/app on
# every run, so a docstring change is a documentation change. Pull requests
# get the build and the link check but no deployment.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

# A newer push to the same ref supersedes its build; the one Pages site takes deployments
# in turn, in the publish job, so a pull request's build never displaces main's.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every release tag that carries the site is built beside main.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the Settings Reference is current
        run: python3 docs/scripts/generate-settings-doc.py --check

      - name: Resolve the site address
        # The site lives under the repository name on GitHub Pages unless
        # docs/public/CNAME names a custom domain, in which case it is served
        # from that domain's root.
        run: |
          if [ -f docs/public/CNAME ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$(tr -d '[:space:]' < docs/public/CNAME)" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build the static site, one version per release and main
        working-directory: docs
        run: |
          npm ci --no-audit --no-fund
          npm run build:versions

      - name: Check every link and anchor in the built site
        working-directory: docs
        run: npm run check-links

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out
          retention-days: 1

  publish:
    name: Publish documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
