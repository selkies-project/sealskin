name: Mobile Unsigned Validation

# Validate any explicit branch or commit without the release environment,
# signing identities, store credentials, or publication steps.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or full commit SHA to validate"
        required: true
        type: string
      refresh_dependencies:
        description: "Regenerate the supported npm and Capacitor dependency metadata"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  XCODE: /Applications/Xcode_26.2.app

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Refresh the supported npm dependency graph
        if: inputs.refresh_dependencies
        working-directory: mobile
        run: npm update rimraf --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install and inspect mobile dependencies
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm ls rimraf glob minimatch

      - name: Build the strict client and unsigned debug app
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ""
        run: bash build.sh

  ios:
    name: iOS simulator build
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the validated commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Refresh the supported npm dependency graph
        if: inputs.refresh_dependencies
        working-directory: mobile
        run: npm update rimraf --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install and inspect mobile dependencies
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm ls rimraf glob minimatch

      - name: Build the strict client and sync Capacitor
        working-directory: mobile
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve native packages
        working-directory: mobile/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            | xcbeautify --renderer github-actions

      - name: Build the unsigned iOS simulator app
        working-directory: mobile/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Check generated dependency metadata is committed
        if: ${{ !inputs.refresh_dependencies }}
        run: git diff --exit-code -- mobile/package-lock.json mobile/ios/App/CapApp-SPM/Package.swift mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Stage dependency resolutions
        run: |
          RESOLUTIONS="$RUNNER_TEMP/mobile-resolutions"
          mkdir -p "$RESOLUTIONS/mobile/ios/App/CapApp-SPM"
          mkdir -p "$RESOLUTIONS/mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          cp mobile/package-lock.json "$RESOLUTIONS/mobile/package-lock.json"
          cp mobile/ios/App/CapApp-SPM/Package.swift "$RESOLUTIONS/mobile/ios/App/CapApp-SPM/Package.swift"
          cp mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RESOLUTIONS/mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

      - name: Keep the generated text resolutions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-resolutions-${{ steps.source.outputs.commit }}
          path: ${{ runner.temp }}/mobile-resolutions/
          if-no-files-found: error
          retention-days: 7
