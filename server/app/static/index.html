<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SealSkin Browser Extension</title>
    <style>
        /* Palette shared with the Selkies dashboard: neutral surfaces, one
           magenta accent, and a pink-to-violet wordmark drawn from the logo.
           Dark unless the browser asks for light. */
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            --bg: #12161d;
            --surface: #181d26;
            --surface-alt: #1f2530;
            --border-color: #2b3441;
            --text: #e6ebf3;
            --text-muted: #aeb9c9;
            --accent: #ec4899;
            --accent-text: #f9a8d4;
            --accent-soft: rgba(236, 72, 153, 0.14);
            --accent-border: rgba(236, 72, 153, 0.45);
            --wordmark-from: #f4a6cf;
            --wordmark-to: #c3b1f7;
            --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
            --border-radius: 12px;
            --border-radius-lg: 16px;
            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f4f5f8;
                --surface: #ffffff;
                --surface-alt: #f6f7f9;
                --border-color: #dfe2ea;
                --text: #23272f;
                --text-muted: #5b6478;
                --accent: #a82a69;
                --accent-text: #a82a69;
                --accent-soft: rgba(168, 42, 105, 0.1);
                --accent-border: rgba(168, 42, 105, 0.4);
                --wordmark-from: #b93a82;
                --wordmark-to: #7b52b0;
                --shadow-md: 0 1px 2px rgba(16, 20, 28, 0.06), 0 8px 24px rgba(16, 20, 28, 0.08);
                --shadow-lg: 0 12px 32px rgba(16, 20, 28, 0.12);
                color-scheme: light;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-family);
            background-color: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background-color: var(--surface);
            border-radius: var(--border-radius-lg);
            padding: 4rem;
            box-shadow: var(--shadow-md);
            max-width: 800px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .brand svg {
            width: 96px;
            height: 96px;
            display: block;
        }

        /* Wordmark: gradient text drawn from the logo hues, with a solid
           fallback where background-clip: text is unsupported. */
        .brand .wordmark {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1;
            color: var(--accent-text);
            background-image: linear-gradient(100deg, var(--wordmark-from) 20%, var(--wordmark-to) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 3.5rem;
            font-size: 1.1rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .store-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 3.5rem;
        }

        .store-button {
            background-color: var(--surface-alt);
            color: var(--text);
            padding: 2rem;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--border-color);
            flex: 1;
        }

        .store-button:hover {
            background-color: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent-text);
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .store-button:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        
        .store-button span {
            font-size: 1.1rem;
        }

        .logo {
            display: inline-block;
            width: 192px;
            height: 192px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain; 
        }
