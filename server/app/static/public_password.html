<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>SealSkin</title>
    <link rel="icon" href="/ui/icons/icon128.png">
    <style>
        /* Palette shared with the web app (client/src/ui/css/options.css); the page is self-contained. */
        :root {
            --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            --bg-0: #0d1117;
            --bg-1: #131822;
            --bg-2: #1a2130;
            --text-primary: #eaf0f8;
            --text-secondary: #b8c2d2;
            --text-muted: #7d8a9f;
            --border-color: rgba(148, 163, 184, 0.14);
            --border-strong: rgba(148, 163, 184, 0.32);
            --accent-primary: #8b7cf6;
            --accent-soft: rgba(139, 124, 246, 0.14);
            --accent-border: rgba(139, 124, 246, 0.5);
            --accent-glow: rgba(139, 124, 246, 0.35);
            --accent-gradient: linear-gradient(135deg, #8b7cf6 0%, #6d5cf5 100%);
            --color-danger-text: #fca5a5;
            --color-danger-border: rgba(239, 68, 68, 0.35);
            --color-success-text: #6ee7b7;
            --color-success-soft: rgba(16, 185, 129, 0.14);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.3);
            --shadow-accent: 0 6px 20px -4px var(--accent-glow);
            --focus-ring: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent-primary);
            --radius-sm: 8px;
            --radius-lg: 16px;
            --dur: 0.18s;
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            background-color: var(--bg-0);
            background-image: radial-gradient(60% 50% at 50% 0%, rgba(139, 124, 246, 0.12), transparent 70%);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 340px;
            padding: 1.25rem;
            background-color: var(--bg-1);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: border-color var(--dur);
        }
        .container.error { border-color: var(--color-danger-border); }

        #password-form { display: flex; gap: 0.6rem; }

        input[type="password"] {
            flex-grow: 1;
            min-width: 0;
            padding: 0.65rem 0.8rem;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: var(--bg-0);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            transition: border-color var(--dur), box-shadow var(--dur);
        }
        input[type="password"]:hover { border-color: var(--border-strong); }
        input[type="password"]:focus { outline: none; border-color: var(--accent-primary); box-shadow: var(--focus-ring); }
        .error input[type="password"] { border-color: var(--color-danger-border); }

        button {
            flex-shrink: 0;
            width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            cursor: pointer;
            transition: filter var(--dur), transform var(--dur), opacity var(--dur);
        }
        button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
        button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        .icon { width: 20px; height: 20px; }

        #success-container {
            display: none;
            justify-content: center;
            align-items: center;
            height: 44px;
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-sm);
            background-color: var(--color-success-soft);
            color: var(--color-success-text);
        }
        #success-container .icon { width: 24px; height: 24px; }
        .success #success-container { display: flex; }
        .success #password-form { display: none; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .shake { animation: shake 0.82s cubic-bezier(.36, .07, .19, .97) both; }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div id="success-container">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <form id="password-form" action="/public/{{SHARE_ID}}" method="post">
            <input type="password" name="password" aria-label="Password" required autofocus autocomplete="off">
            <button type="submit" aria-label="Download">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('password-form');
        const container = document.getElementById('container');
        const passwordInput = form.querySelector('input[type="password"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            container.classList.remove('error', 'shake');

            const button = form.querySelector('button');
            button.disabled = true;

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form)
                });

                if (response.ok) {
                    container.classList.add('success');

                    const blob = await response.blob();

                    const disposition = response.headers.get('content-disposition');
                    let filename = 'download';
                    if (disposition && disposition.includes('attachment')) {
                        const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                        if (matches && matches[1]) {
                            filename = matches[1].replace(/['"]/g, '');
                        }
                    }

                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                } else {
                    container.classList.add('error');
                    container.classList.add('shake');
                    passwordInput.value = '';
                    passwordInput.focus();

                    setTimeout(() => {
                        container.classList.remove('shake');
                    }, 820);
                }
            } catch (error) {
                console.error('Form submission failed:', error);
                container.classList.add('error');
            } finally {
                if (!container.classList.contains('success')) {
                    button.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
