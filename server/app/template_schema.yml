# SealSkin application template schema.
#
# Each entry describes one environment variable that the template editor in the
# admin UI exposes. The server serves this file at GET /api/ui/template_schema so
# a new variable ships with the server image instead of a client release.
#
# The variables mirror what the linuxserver/docker-baseimage-selkies init
# scripts and the upstream Selkies server (src/selkies/settings.py) read. The
# editor only stores values that differ from `default`, so `default` must be
# the value the container effectively runs with when the variable is unset.
#
# Fields:
#   name      Environment variable name passed to the session container.
#   category  Editor grouping: ui, app, hardening, general, webrtc, docker.
#   type      text | boolean | select.
#   default   Default value shown in the editor (always a string).
#   docker    true when the variable is translated into a Docker run option
#             instead of being passed to the container environment.
#   options   For select types: list of {value, label_key} or {value, label}.
#             label_key resolves to the translation key
#             options.appTemplates.settings.<NAME>.options.<label_key>.
#
# Labels and descriptions are looked up by the client from its translations at
# options.appTemplates.settings.<NAME>.label / .description and fall back to the
# variable name when missing, so hand-added entries work without translations.
#
# Renamed upstream variables (SELKIES_H264_* -> SELKIES_VIDEO_*, the clipboard
# trio -> SELKIES_ENABLE_CLIPBOARD, ...) are translated from older templates by
# migrate_legacy_template_settings in server/app/config_store.py.
